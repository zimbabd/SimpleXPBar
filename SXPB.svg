<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 1. Сплошной тёмный фон (для формата JPEG без прозрачности) -->
  <rect width="512" height="512" fill="#0d0d13"/>
  
  <!-- 2. Круглая золотая эмблема -->
  <circle cx="256" cy="256" r="230" fill="#14121c" stroke="#d4af37" stroke-width="12"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#2a2438" stroke-width="4"/>

  <!-- 3. Текст "XP" сверху -->
  <text x="256" y="155" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="76" fill="#ffd700" text-anchor="middle" letter-spacing="2">XP</text>

  <!-- 4. Рамка полосы прогресса -->
  <rect x="76" y="216" width="360" height="80" rx="10" fill="#0a0a10" stroke="#d4af37" stroke-width="4"/>
  
  <!-- 5. Заполнение полосы (Фиолетовый цвет опыта WoW) -->
  <rect x="82" y="222" width="220" height="68" rx="6" fill="#8a2be2"/>
  
  <!-- 6. Сегменты / Деления (Blizzard style) -->
  <line x1="154" y1="222" x2="154" y2="290" stroke="#0a0a10" stroke-width="4"/>
  <line x1="226" y1="222" x2="226" y2="290" stroke="#0a0a10" stroke-width="4"/>
  <line x1="298" y1="222" x2="298" y2="290" stroke="#0a0a10" stroke-width="4"/>
  <line x1="370" y1="222" x2="370" y2="290" stroke="#0a0a10" stroke-width="4"/>

  <!-- 7. Текст "SIMPLE" снизу -->
  <text x="256" y="365" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">SIMPLE</text>
  <text x="256" y="400" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="18" fill="#8a2be2" text-anchor="middle" letter-spacing="6">BAR</text>
</svg>
